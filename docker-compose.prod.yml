name: saybu-prod

# Produksi: hanya Caddy yang terekspos publik (80/443). Postgres & Kafka tidak
# punya port host. Service memakai hostname Docker, bukan localhost.
# Jalankan migrasi dulu:
#   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
# lalu:
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans

x-common: &common
  restart: unless-stopped
  stop_grace_period: 15s
  environment: &common-env
    APP_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    TZ: ${TZ:-Asia/Jakarta}
    KAFKA_BROKERS: kafka:9092
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib}
    JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
    JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
    POSTGRES_USER: ${POSTGRES_USER:-saybu}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}
    AUTH_DB_DSN: postgres://${POSTGRES_USER:-saybu}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}@postgres:5432/saybu_auth?sslmode=disable
    CATALOG_DB_DSN: postgres://${POSTGRES_USER:-saybu}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}@postgres:5432/saybu_catalog?sslmode=disable
    SHIPPING_DB_DSN: postgres://${POSTGRES_USER:-saybu}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}@postgres:5432/saybu_shipping?sslmode=disable
    ORDER_DB_DSN: postgres://${POSTGRES_USER:-saybu}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}@postgres:5432/saybu_orders?sslmode=disable
    PAYMENT_DB_DSN: postgres://${POSTGRES_USER:-saybu}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}@postgres:5432/saybu_payments?sslmode=disable
    NOTIFICATION_DB_DSN: postgres://${POSTGRES_USER:-saybu}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}@postgres:5432/saybu_notifications?sslmode=disable
    AUTH_GRPC_ADDR: auth:50051
    CATALOG_GRPC_ADDR: catalog:50052
    SHIPPING_GRPC_ADDR: shipping:50053
    ORDER_GRPC_ADDR: order:50054
    PAYMENT_GRPC_ADDR: payment:50055
    ORDER_EXPIRY: ${ORDER_EXPIRY:-24h}
    ORDER_EXPIRY_SWEEP: ${ORDER_EXPIRY_SWEEP:-1m}
    GATEWAY_HTTP_ADDR: :8081
    GATEWAY_CORS_ORIGINS: https://${SITE_DOMAIN:?SITE_DOMAIN wajib}
    COOKIE_SECURE: "true"
    UPLOAD_DIR: /srv/uploads
    UPLOAD_URL_PREFIX: /uploads
    UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
    BANK_NAME: ${BANK_NAME:-BCA}
    BANK_ACCOUNT: ${BANK_ACCOUNT:-1234567890}
    BANK_HOLDER: ${BANK_HOLDER:-Saybu Buah & Sayur}
    NOTIFICATION_HTTP_ADDR: :8086
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-disabled}
    TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-disabled}

services:
  postgres:
    image: postgres:17-alpine
    container_name: saybu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saybu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}
      POSTGRES_DB: ${POSTGRES_DB:-saybu}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saybu} -d ${POSTGRES_DB:-saybu}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: saybu-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: saybu-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./infra/kafka:/scripts:ro
    restart: "no"

  auth:
    <<: *common
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER wajib}/saybu-auth:${IMAGE_TAG:-latest}
    container_name: saybu-auth
    environment:
      <<: *common-env
      AUTH_GRPC_ADDR: :50051
      AUTH_ADMIN_ADDR: :9101
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  catalog:
    <<: *common
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER wajib}/saybu-catalog:${IMAGE_TAG:-latest}
    container_name: saybu-catalog
    environment:
      <<: *common-env
      CATALOG_GRPC_ADDR: :50052
      CATALOG_ADMIN_ADDR: :9102
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  shipping:
    <<: *common
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER wajib}/saybu-shipping:${IMAGE_TAG:-latest}
    container_name: saybu-shipping
    environment:
      <<: *common-env
      SHIPPING_GRPC_ADDR: :50053
      SHIPPING_ADMIN_ADDR: :9103
    depends_on:
      postgres:
        condition: service_healthy

  order:
    <<: *common
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER wajib}/saybu-order:${IMAGE_TAG:-latest}
    container_name: saybu-order
    environment:
      <<: *common-env
      ORDER_GRPC_ADDR: :50054
      ORDER_ADMIN_ADDR: :9104
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment:
    <<: *common
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER wajib}/saybu-payment:${IMAGE_TAG:-latest}
    container_name: saybu-payment
    environment:
      <<: *common-env
      PAYMENT_GRPC_ADDR: :50055
      PAYMENT_ADMIN_ADDR: :9105
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification:
    <<: *common
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER wajib}/saybu-notification:${IMAGE_TAG:-latest}
    container_name: saybu-notification
    environment:
      <<: *common-env
      NOTIFICATION_HTTP_ADDR: :8086
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  gateway:
    <<: *common
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER wajib}/saybu-gateway:${IMAGE_TAG:-latest}
    container_name: saybu-gateway
    volumes:
      - uploads:/srv/uploads
    depends_on:
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      shipping:
        condition: service_healthy
      order:
        condition: service_healthy
      payment:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    container_name: saybu-caddy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN wajib}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - uploads:/srv/uploads:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    profiles: ["migrate"]
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER wajib}/saybu-migrate:${IMAGE_TAG:-latest}
    container_name: saybu-migrate
    restart: "no"
    environment: *common-env
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: saybu-prometheus
    profiles: ["observability"]
    volumes:
      - ./infra/observability/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: saybu-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD wajib}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-disabled}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-disabled}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  uploads:
  promdata:
  grafanadata:
  caddydata:
  caddyconfig:
