global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Service Go berjalan di host (make dev), bukan di Docker. Container Prometheus
# menjangkaunya lewat host.docker.internal (lihat extra_hosts di docker-compose).
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: auth
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: catalog
    static_configs:
      - targets: ["host.docker.internal:9102"]

  - job_name: shipping
    static_configs:
      - targets: ["host.docker.internal:9103"]

  - job_name: order
    static_configs:
      - targets: ["host.docker.internal:9104"]

  - job_name: payment
    static_configs:
      - targets: ["host.docker.internal:9105"]

  - job_name: notification
    static_configs:
      - targets: ["host.docker.internal:8086"]
