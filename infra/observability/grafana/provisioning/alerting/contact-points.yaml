apiVersion: 1

# Kredensial diisi dari environment Grafana (docker-compose), bukan disimpan di repo.
# Bila kosong, aturan tetap aktif tetapi pengiriman Telegram gagal & tercatat di log Grafana.
contactPoints:
  - orgId: 1
    name: telegram-admin
    receivers:
      - uid: telegram-admin
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_ADMIN_CHAT_ID
          message: |
            [SAYBU/{{ .Status }}] {{ .CommonLabels.alertname }}
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}

policies:
  - orgId: 1
    receiver: telegram-admin
    group_by:
      - alertname
      - grafana_folder
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
