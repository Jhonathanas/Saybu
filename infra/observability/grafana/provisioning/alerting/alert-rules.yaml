apiVersion: 1

groups:
  - orgId: 1
    name: saybu-operations
    folder: Saybu Alerts
    interval: 1m
    rules:
      - uid: saybu-service-down
        title: Layanan Saybu tidak merespons
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'up{job=~"gateway|auth|catalog|shipping|order|payment|notification"} == 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: query
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: 'Service {{ $labels.job }} gagal di-scrape selama 2 menit.'
        labels:
          severity: critical
          service: saybu

      - uid: saybu-http-5xx
        title: Rasio 5xx gateway tinggi
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(rate(saybu_gateway_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(saybu_gateway_http_requests_total[5m])), 0.001)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: query
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: 'Rasio respons 5xx gateway di atas 5% selama 5 menit.'
        labels:
          severity: warning
          service: saybu

      - uid: saybu-kafka-lag
        title: Kafka consumer lag tinggi
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'max by (job, topic) ({__name__=~"saybu_.*_kafka_consumer_lag"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: query
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 100
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: 'Consumer {{ $labels.job }} tertinggal > 100 pesan di {{ $labels.topic }}.'
        labels:
          severity: warning
          service: saybu

      - uid: saybu-outbox-lag
        title: Outbox relay tertunda
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'max by (job) ({__name__=~"saybu_.*_outbox_lag_seconds"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: query
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 300
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: 'Outbox {{ $labels.job }} memiliki event tertua > 5 menit.'
        labels:
          severity: critical
          service: saybu
