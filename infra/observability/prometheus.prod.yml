global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Produksi: semua service berjalan di network Docker yang sama dengan Prometheus.
# Nama job sengaja sama dengan prometheus.yml (dev) agar rule alerting tidak perlu diubah.
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8081"]

  - job_name: auth
    static_configs:
      - targets: ["auth:9101"]

  - job_name: catalog
    static_configs:
      - targets: ["catalog:9102"]

  - job_name: shipping
    static_configs:
      - targets: ["shipping:9103"]

  - job_name: order
    static_configs:
      - targets: ["order:9104"]

  - job_name: payment
    static_configs:
      - targets: ["payment:9105"]

  - job_name: notification
    static_configs:
      - targets: ["notification:8086"]
